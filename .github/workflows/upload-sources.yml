name: Upload sources

# Run by hand after an app release. It takes the source artifact that the app's own release run produced, checks it, adds the upstream
# archives the app build does not produce, and publishes everything as one GitHub Release. If the source is the same as in the latest Release
# of that platform, it publishes nothing: that Release applies to this version too.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform of the release
        type: choice
        options: [android, apple, windows]
        required: true
      app_version:
        description: App version, for example 1.0.0
        required: true
      source_repo:
        description: Repository (owner/name) whose run produced the artifact
        required: true
      run_id:
        description: ID of that run (android and apple; not used for windows)
        required: false
        default: ""
      artifact_name:
        description: Android and apple, the name of the artifact in that run. Windows, the tag of the (pre)release in the source repository that holds the build
        required: true
      dry_run:
        description: Only compare with the latest Release and write the result to the run summary; create nothing
        type: boolean
        default: false
      revision:
        description: Leave empty for the first release of this version and platform; "r2", "r3" and so on for a re-issue
        required: false
        default: ""

permissions:
  contents: write

concurrency: upload-sources

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.app_version }}
          PLATFORM: ${{ inputs.platform }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad app version" >&2; exit 1; }
          [[ -z "$REVISION" || "$REVISION" =~ ^r[2-9][0-9]*$ ]] || { echo "revision must be empty or r2, r3, ..." >&2; exit 1; }
          tag="app-${VERSION}-${PLATFORM}${REVISION:+-$REVISION}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A published Release is never replaced.
          if gh release view "$tag" >/dev/null 2>&1; then echo "release $tag already exists; use a revision" >&2; exit 1; fi

      - name: Download the app build's source files
        env:
          # A token that can read Actions artifacts and release assets of the repository that built the app. Kept as a repository secret.
          GH_TOKEN: ${{ secrets.APP_ARTIFACT_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ && "$ARTIFACT" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad input" >&2; exit 1; }
          if [ "$PLATFORM" = windows ]; then
            # The Windows library build publishes its files, with a SHA256SUMS, on a release of the build repository.
            gh release download "$ARTIFACT" --repo "$SOURCE_REPO" --dir "$RUNNER_TEMP/artifact"
          else
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id" >&2; exit 1; }
            gh run download "$RUN_ID" --repo "$SOURCE_REPO" --name "$ARTIFACT" --dir "$RUNNER_TEMP/artifact"
          fi
          ls -R "$RUNNER_TEMP/artifact"

      - name: Check and collect
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.app_version }}
        run: bash scripts/make-release.sh "$PLATFORM" "$VERSION" "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/release"

      - name: Compare with the latest Release
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          echo "same=false" >> "$GITHUB_OUTPUT"
          # A re-issue is always a new Release.
          if [ -n "$REVISION" ]; then echo "re-issue: no comparison" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          latest="$(gh release list --limit 100 --json tagName,createdAt --jq "map(select(.tagName | test(\"^app-.+-${PLATFORM}(-r[0-9]+)?$\"))) | sort_by(.createdAt) | reverse | .[0].tagName // empty")"
          if [ -z "$latest" ]; then echo "No earlier Release for $PLATFORM: a new Release would be made." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$latest" --dir "$RUNNER_TEMP/previous"
          if bash scripts/same-source.sh "$RUNNER_TEMP/previous" "$RUNNER_TEMP/release" > "$RUNNER_TEMP/compare.txt"; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "No new Release: the source is the same as in $latest, which applies to this version too." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "A new Release would be made: the source differs from $latest." | tee -a "$GITHUB_STEP_SUMMARY"; cat "$RUNNER_TEMP/compare.txt"
            { echo '```'; cat "$RUNNER_TEMP/compare.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the Release
        if: steps.cmp.outputs.same != 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.app_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/notes.sh "$PLATFORM" "$VERSION" "$RUN_URL" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/release/*
